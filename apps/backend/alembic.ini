; AILIZA — Alembic-Konfiguration
;
; Persistente Datenbanken werden beim FastAPI-Lifespan mit `alembic upgrade
; head` auf den freigegebenen Schemastand gebracht. Ein normaler Python-
; Import von apps.backend.* bleibt weiterhin nebenwirkungsfrei. Fuer einen
; manuellen Betriebs-/Diagnoselauf aus dem Repository-Root:
;   cd apps/backend && alembic upgrade head
;
; Die tatsaechliche Datenbank-URL wird NICHT hier eingetragen, sondern zur
; Laufzeit in env.py aus derselben Quelle gelesen wie die Anwendung selbst
; (apps.backend.database.DATABASE_URL, inkl. AILIZA_DATABASE_URL-Handling
; und Postgres-Dialekt-Normalisierung) -- eine einzige Quelle der Wahrheit,
; kein doppelt gepflegter Connection-String.

[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
