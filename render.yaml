services:
  - type: web
    name: ailiza-backend
    runtime: python
    buildCommand: pip install -r apps/backend/requirements-core.txt
    # WICHTIG (PR 2): NICHT mit --workers > 1 starten und NICHT als mehrere
    # parallele Instanzen betreiben -- die Genehmigungs-Atomaritaet
    # (decide_approval_lock) und die Audit-Hash-Chain (_audit_write_lock)
    # sind aktuell nur prozessinterne Python-Sperren, keine DB-seitige
    # Sperre. Siehe DEPLOY_RENDER.md.
    startCommand: uvicorn apps.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render-Service ist Produktion: deaktiviert Debug-/Testpfade und
      # aktiviert die produktionsspezifischen Sicherheitsprüfungen.
      - key: AILIZA_ENV
        value: "production"
      - key: AILIZA_TEST_MODE
        value: "false"
      - key: AILIZA_EXTERNAL_LLM_ENABLED
        value: "false"
      - key: AILIZA_DEBUG
        value: "false"
      # C2: CORS auf Frontend-Origin einschränken (Wildcard verboten in Production).
      # Wert anpassen auf die tatsächliche Render-Frontend-URL, z. B.:
      # https://ailiza-frontend.onrender.com
      # Mehrere Origins kommasepariert: https://ailiza.example.com,https://www.ailiza.example.com
      - key: AILIZA_CORS_ORIGINS
        value: "https://ailiza-1.onrender.com"
      # Render terminiert TLS und leitet HTTP bereits am Edge auf HTTPS um.
      # Ein zusaetzlicher App-Redirect wuerde den internen HTTP-Hop erneut
      # umleiten. HSTS wird deshalb getrennt durch die Anwendung gesetzt.
      - key: AILIZA_FORCE_HTTPS
        value: "false"
      - key: AILIZA_HSTS_ENABLED
        value: "true"
      - key: AILIZA_SECRET_KEY
        sync: false
      # Eigener Schluessel NUR fuer die HMAC-Pseudonymisierung von
      # Nutzernamen in Auth-Logs -- bewusst getrennt von AILIZA_SECRET_KEY
      # (JWT-Signatur), damit ein kompromittierter Logging-Schluessel nicht
      # auch Sessions faelschen kann. Mindestens 32 zufaellige Zeichen.
      # Fehlt der Wert, wird kein Fingerprint geloggt (kein Fallback, kein
      # Login-Ausfall).
      - key: AILIZA_LOG_HMAC_KEY
        sync: false
      # Optional: Schluesselversion, wird in jeden Fingerprint eingebettet
      # (erlaubt spaeteren Schluesselwechsel ohne Verlust der Nachvollziehbarkeit).
      - key: AILIZA_LOG_HMAC_KEY_VERSION
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Neon/PostgreSQL Connection String (https://neon.tech)
      # Format: postgresql+psycopg://user:pass@host/dbname?sslmode=require
      # Wird automatisch in _resolve_database_url() normalisiert.
      - key: AILIZA_DATABASE_URL
        sync: false
    healthCheckPath: /health
