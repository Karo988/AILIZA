name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt pytest pytest-asyncio httpx bcrypt pyotp python-jose[cryptography]

      - name: Tests (Root)
        run: pytest tests/ -v --tb=short

      # apps/backend/tests/ ist verwaist (kaputte Imports auf nicht mehr
      # existierende Module: compliance_auditor, KillSwitch, policy_engine,
      # policies.pii_taxonomy, governance, main, require_operator).
      # Aktive Test-Suite ist ausschliesslich tests/ (siehe Schritt oben).
      # Deaktiviert statt geloescht -- separates Aufraeumen folgt spaeter.
      # - name: Tests (Backend, verwaist -- vorerst deaktiviert)
      #   run: PYTHONPATH=. pytest apps/backend/tests/ -v --tb=short

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren
        working-directory: apps/frontend
        run: npm ci

      - name: Frontend-Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Frontend-Build
        working-directory: apps/frontend
        run: npm run build

  sandbox-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      AILIZA_EXPECTED_CI_PLATFORM: ${{ matrix.platform }}
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      AILIZA_SECRET_KEY: ci-sandbox-platform-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt pytest pytest-asyncio httpx bcrypt pyotp "python-jose[cryptography]"

      - name: Workspace-Sicherheitsprüfungen
        run: python -m pytest tests/test_sandbox_sensitive_workspace.py tests/test_standard_tools_workspace_handoff.py -v --tb=short --junitxml=sandbox-results.xml

      - name: Sicherheitsrelevante Skips ausschließen
        run: python -c "import xml.etree.ElementTree as ET; root=ET.parse('sandbox-results.xml').getroot(); skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite')); assert skipped == 0, f'{skipped} sicherheitsrelevante Tests wurden übersprungen'"

  # Eigener Job statt Erweiterung des "test"-Jobs: der Postgres-Read-only-
  # Nachweis (Gate 1) braucht einen isolierten PostgreSQL-Service, den der
  # bestehende SQLite-Job nicht hat. Getrennter Job haelt den Standard-
  # Testlauf unveraendert schnell/einfach und macht einen Postgres-
  # Infrastrukturfehler klar vom eigentlichen Testergebnis unterscheidbar.
  postgres-audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        # Nur temporaere, rein CI-lokale Zugangsdaten -- kein Repository-
        # Secret, keine Render-/Neon-Verbindung. Der Container existiert
        # ausschliesslich fuer die Laufzeit dieses Jobs.
        env:
          POSTGRES_USER: ailiza_ci
          POSTGRES_PASSWORD: ailiza_ci_ephemeral_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      AILIZA_SECRET_KEY: ci-postgres-audit-secret-key-not-for-production
      # Zeigt AUSSCHLIESSLICH auf den isolierten CI-Service oben --
      # niemals auf Render/Neon oder eine andere echte Datenbank. Die
      # damit getesteten Tests (tests/test_memory_audit_cli.py, Praefix
      # test_postgres_) legen und loeschen ihre eigenen, pro Testfall
      # frischen Datenbanken ueber diese Admin-Verbindung.
      AILIZA_TEST_POSTGRES_ADMIN_URL: "postgresql+psycopg://ailiza_ci:ailiza_ci_ephemeral_test_only@localhost:5432/postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt pytest pytest-asyncio httpx bcrypt pyotp python-jose[cryptography]

      - name: PostgreSQL-Audit-Tests (verpflichtend -- dürfen NICHT übersprungen werden)
        run: |
          set -o pipefail
          pytest tests/test_memory_audit_cli.py -k postgres -v --tb=short | tee /tmp/pg_audit_output.txt
          if grep -q "skipped" /tmp/pg_audit_output.txt; then
            echo "FEHLER: PostgreSQL-Audit-Tests wurden übersprungen -- in diesem Job nicht zulässig (AILIZA_TEST_POSTGRES_ADMIN_URL fehlt oder Service nicht erreichbar)."
            exit 1
          fi
          if ! grep -q "3 passed" /tmp/pg_audit_output.txt; then
            echo "FEHLER: Erwartet genau 3 bestandene PostgreSQL-Audit-Tests."
            exit 1
          fi

      - name: PostgreSQL-Memory-Tenant-Migrationstests (verpflichtend -- dürfen NICHT übersprungen werden)
        run: |
          set -o pipefail
          pytest tests/test_memory_tenant_migration_postgres.py -v --tb=short | tee /tmp/pg_tenant_migration_output.txt
          if grep -q "skipped" /tmp/pg_tenant_migration_output.txt; then
            echo "FEHLER: PostgreSQL-Memory-Tenant-Migrationstests wurden übersprungen -- in diesem Job nicht zulässig."
            exit 1
          fi
          if ! grep -q "5 passed" /tmp/pg_tenant_migration_output.txt; then
            echo "FEHLER: Erwartet genau 5 bestandene PostgreSQL-Memory-Tenant-Migrationstests."
            exit 1
          fi

  # Eigener Job statt zusaetzlicher Schritt im bestehenden "test"-Job: ein
  # Browser- oder Server-Startfehler im E2E-Lauf soll das Python-Testergebnis
  # nicht unuebersichtlich machen (getrennte, klar zuordenbare CI-Ergebnisse).
  frontend-e2e:
    runs-on: ubuntu-latest
    env:
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      AILIZA_SECRET_KEY: ci-e2e-secret-key-not-for-production-32ch
      AILIZA_LOG_HMAC_KEY: ci-e2e-log-hmac-key-not-for-production-32ch

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Backend-Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt bcrypt pyotp

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren (reproduzierbar via Lockfile)
        working-directory: apps/frontend
        run: npm ci

      - name: Playwright Chromium installieren
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Backend starten (Login-Registrierung-UX-Test)
        run: |
          nohup python -m uvicorn apps.backend.main:app --host 127.0.0.1 --port 8811 --log-level warning \
            > /tmp/ailiza-e2e-login.log 2>&1 &
          echo $! > /tmp/ailiza-e2e-login.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8811/health && exit 0
            sleep 1
          done
          echo "Backend nicht innerhalb von 60s erreichbar:"; cat /tmp/ailiza-e2e-login.log; exit 1

      - name: Playwright – Login/Registrierung-UX
        working-directory: apps/frontend
        run: node tests/login-registration-ux.test.js http://127.0.0.1:8811

      - name: Backend stoppen (Login-Registrierung-UX-Test)
        if: always()
        run: kill "$(cat /tmp/ailiza-e2e-login.pid)" 2>/dev/null || true

      # Eigener Server-Prozess pro Test-Datei: /auth/login ist auf 10
      # Anfragen/Minute begrenzt (bewusst NICHT gelockert). Ein gemeinsamer
      # Prozess fuer beide Playwright-Dateien wuerde das In-Memory-Rate-
      # Limit-Budget ueberschreiten und die Tests faelschlich fehlschlagen
      # lassen -- ein frischer Prozess hat ein frisches Budget.
      - name: Backend starten (Bootstrap-Consent-Gate-Test)
        run: |
          nohup python -m uvicorn apps.backend.main:app --host 127.0.0.1 --port 8812 --log-level warning \
            > /tmp/ailiza-e2e-bootstrap.log 2>&1 &
          echo $! > /tmp/ailiza-e2e-bootstrap.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8812/health && exit 0
            sleep 1
          done
          echo "Backend nicht innerhalb von 60s erreichbar:"; cat /tmp/ailiza-e2e-bootstrap.log; exit 1

      - name: Playwright – Bootstrap-Consent-Gate (PR #62 Regression)
        working-directory: apps/frontend
        run: node tests/bootstrap-consent-gate.test.js http://127.0.0.1:8812

      - name: Backend stoppen (Bootstrap-Consent-Gate-Test)
        if: always()
        run: kill "$(cat /tmp/ailiza-e2e-bootstrap.pid)" 2>/dev/null || true
