name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt pytest pytest-asyncio httpx bcrypt pyotp python-jose[cryptography]

      # gitleaks wird hier gebraucht, damit tests/test_secret_scan_rules.py
      # tatsaechlich laeuft. Ohne die Installation ueberspringt pytest diese
      # Datei stillschweigend (skipif) -- der Lauf saehe gruen aus, obwohl
      # die Scanner-Selbsttests nie ausgefuehrt wurden. Genau das verhindert
      # der Anti-Skip-Schritt weiter unten.
      - name: gitleaks installieren (fuer die Scanner-Selbsttests)
        uses: ./.github/actions/install-gitleaks

      - name: Tests (Root)
        run: pytest tests/ -v --tb=short

      # Gegenprobe: ein "skipped" bei den Scanner-Selbsttests ist ein
      # Fehler, kein zulaessiges Ergebnis. Ein Scanner-Test, der nie laeuft,
      # ist genauso wertlos wie ein Scanner, der nichts findet.
      - name: Scanner-Selbsttests duerfen nicht uebersprungen werden
        run: |
          set -euo pipefail
          out="$(pytest tests/test_secret_scan_rules.py -q --tb=short)"
          echo "$out"
          if echo "$out" | grep -qiE '[0-9]+ skipped'; then
            echo "::error::Scanner-Selbsttests wurden uebersprungen -- gitleaks fehlt oder skipif greift faelschlich."
            exit 1
          fi

      # apps/backend/tests/ ist verwaist (kaputte Imports auf nicht mehr
      # existierende Module: compliance_auditor, KillSwitch, policy_engine,
      # policies.pii_taxonomy, governance, main, require_operator).
      # Aktive Test-Suite ist ausschliesslich tests/ (siehe Schritt oben).
      # Deaktiviert statt geloescht -- separates Aufraeumen folgt spaeter.
      # - name: Tests (Backend, verwaist -- vorerst deaktiviert)
      #   run: PYTHONPATH=. pytest apps/backend/tests/ -v --tb=short

  # Secret-Scan (docs/AILIZA_PUSH_SICHERHEITSREGEL.md, Abschnitt 3,
  # Schutzschicht 3). Eigener Job, damit ein Fund sofort als Sicherheits-
  # ereignis erkennbar ist und nicht in einem Testprotokoll untergeht.
  #
  # Geprueft wird der neu zu uebertragende COMMIT-BEREICH, nicht nur der
  # aktuelle Dateistand: ein Secret, das in einem Zwischencommit hinzugefuegt
  # und im naechsten wieder entfernt wurde, steht dauerhaft in der Historie
  # und muss gefunden werden.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Vollstaendige Historie -- ohne sie laesst sich der Commit-Bereich
          # nicht aufloesen und der Scan wuerde stillschweigend zu wenig pruefen.
          fetch-depth: 0
          # Der Job liest nur; ein im Runner hinterlegtes Push-Token waere
          # unnoetige Angriffsflaeche.
          persist-credentials: false

      - name: gitleaks installieren
        uses: ./.github/actions/install-gitleaks

      - name: Prüfbereich bestimmen
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Bei einem Pull Request ist github.sha der von GitHub erzeugte
          # Merge-Commit, nicht der tatsaechliche Branch-Kopf. Fuer den
          # Pruefbereich zaehlt der echte Kopf.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NULL_SHA="0000000000000000000000000000000000000000"

          # Fail-closed: laesst sich der Bereich nicht sicher bestimmen
          # (neuer Branch, Force-Push, fehlender Vorgaenger-Commit), wird die
          # VOLLSTAENDIGE Historie geprueft -- lieber zu viel als zu wenig.
          if [ "$EVENT" = "pull_request" ] && [ -n "${BASE_SHA:-}" ] \
             && [ -n "${PR_HEAD_SHA:-}" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
             && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            # Echter Merge-Base statt der Basis-Spitze: sonst wuerden bei
            # zwischenzeitlich weitergelaufenem Zielbranch fremde Commits
            # mitgeprueft oder eigene uebersehen.
            MB="$(git merge-base "$BASE_SHA" "$PR_HEAD_SHA")"
            LOG_OPTS="${MB}..${PR_HEAD_SHA}"
            SCOPE="Pull Request: ${MB}..${PR_HEAD_SHA} (Merge-Base ermittelt)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$NULL_SHA" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            LOG_OPTS="${BEFORE}..${FALLBACK_SHA}"
            SCOPE="Push: ${BEFORE}..${FALLBACK_SHA}"
          else
            LOG_OPTS="--all"
            SCOPE="Vollständige Historie (Bereich nicht eindeutig bestimmbar — fail-closed)"
          fi

          echo "log_opts=${LOG_OPTS}" >> "$GITHUB_OUTPUT"
          echo "Prüfbereich: ${SCOPE}"
          echo "### Secret-Scan — Prüfbereich" >> "$GITHUB_STEP_SUMMARY"
          echo "${SCOPE}" >> "$GITHUB_STEP_SUMMARY"

      # --redact schwaerzt den gefundenen Wert. Das allein genuegt nicht:
      # der eingebaute --verbose-Ausdruck gibt zusaetzlich Author und Email
      # aus -- personenbezogene Daten in einem Protokoll, das jede Person
      # lesen kann, die das Repository lesen darf. Gemessen am 26.08.2026
      # gegen 8.28.0. Deshalb kein --verbose, sondern eine eigene Vorlage,
      # die ausschliesslich Regel, Datei, Zeile und Commit ausgibt
      # (.github/gitleaks-report.tmpl).
      #
      # Hinweis: --report-template setzt das Format entgegen dem Hilfetext
      # NICHT selbst; --report-format template muss mit angegeben werden,
      # sonst bricht gitleaks mit "Unknown report format" ab.
      #
      # --exit-code 1 macht den Job bei einem Fund tatsaechlich rot. Kein
      # continue-on-error, keine reine Warnung.
      - name: Secret-Scan (Commit-Bereich)
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-range.txt"
          status=0
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts "${{ steps.range.outputs.log_opts }}" \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format template \
            --report-template .github/gitleaks-report.tmpl \
            --report-path "$report" || status=$?
          if [ -s "$report" ]; then cat "$report"; fi
          exit $status

      # Zweiter Modus, bewusst zusaetzlich. Gemessen am 26.08.2026 gegen
      # 8.28.0: ein Secret, das ausschliesslich bei einer Merge-Konflikt-
      # aufloesung entsteht, findet der git-Modus NICHT -- auch nicht mit
      # --log-opts "--all". Der Dateistand-Scan findet es. Umgekehrt findet
      # nur der git-Modus ein Secret, das hinzugefuegt und spaeter wieder
      # geloescht wurde. Erst beide zusammen decken beide Faelle ab; das
      # blosse Weglassen von --no-merges reicht nachweislich nicht.
      - name: Secret-Scan (Dateistand — Merge-Auflösungen)
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-dir.txt"
          status=0
          gitleaks dir \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format template \
            --report-template .github/gitleaks-report.tmpl \
            --report-path "$report" \
            . || status=$?
          if [ -s "$report" ]; then cat "$report"; fi
          exit $status

      # Kein Upload eines Fundberichts als Artefakt: der Bericht enthaelt
      # Fundstellen und waere ein weiterer Ort, an dem sensible Treffer
      # liegen. Regel, Datei und Zeile stehen bereits im Protokoll oben.

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren
        working-directory: apps/frontend
        run: npm ci

      - name: Frontend-Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Frontend-Build
        working-directory: apps/frontend
        run: npm run build

  sandbox-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      AILIZA_EXPECTED_CI_PLATFORM: ${{ matrix.platform }}
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      AILIZA_SECRET_KEY: ci-sandbox-platform-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt pytest pytest-asyncio httpx bcrypt pyotp "python-jose[cryptography]"

      - name: Workspace-Sicherheitsprüfungen
        run: python -m pytest tests/test_sandbox_sensitive_workspace.py tests/test_standard_tools_workspace_handoff.py -v --tb=short --junitxml=sandbox-results.xml

      - name: Sicherheitsrelevante Skips ausschließen
        run: python -c "import xml.etree.ElementTree as ET; root=ET.parse('sandbox-results.xml').getroot(); skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite')); assert skipped == 0, f'{skipped} sicherheitsrelevante Tests wurden übersprungen'"

  # Eigener Job statt Erweiterung des "test"-Jobs: der Postgres-Read-only-
  # Nachweis (Gate 1) braucht einen isolierten PostgreSQL-Service, den der
  # bestehende SQLite-Job nicht hat. Getrennter Job haelt den Standard-
  # Testlauf unveraendert schnell/einfach und macht einen Postgres-
  # Infrastrukturfehler klar vom eigentlichen Testergebnis unterscheidbar.
  postgres-audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        # Nur temporaere, rein CI-lokale Zugangsdaten -- kein Repository-
        # Secret, keine Render-/Neon-Verbindung. Der Container existiert
        # ausschliesslich fuer die Laufzeit dieses Jobs.
        env:
          POSTGRES_USER: ailiza_ci
          POSTGRES_PASSWORD: ailiza_ci_ephemeral_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      AILIZA_SECRET_KEY: ci-postgres-audit-secret-key-not-for-production
      # Zeigt AUSSCHLIESSLICH auf den isolierten CI-Service oben --
      # niemals auf Render/Neon oder eine andere echte Datenbank. Die
      # damit getesteten Tests (tests/test_memory_audit_cli.py, Praefix
      # test_postgres_) legen und loeschen ihre eigenen, pro Testfall
      # frischen Datenbanken ueber diese Admin-Verbindung.
      AILIZA_TEST_POSTGRES_ADMIN_URL: "postgresql+psycopg://ailiza_ci:ailiza_ci_ephemeral_test_only@localhost:5432/postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt pytest pytest-asyncio httpx bcrypt pyotp python-jose[cryptography]

      - name: PostgreSQL-Audit-Tests (verpflichtend -- dürfen NICHT übersprungen werden)
        run: |
          set -o pipefail
          pytest tests/test_memory_audit_cli.py -k postgres -v --tb=short | tee /tmp/pg_audit_output.txt
          if grep -q "skipped" /tmp/pg_audit_output.txt; then
            echo "FEHLER: PostgreSQL-Audit-Tests wurden übersprungen -- in diesem Job nicht zulässig (AILIZA_TEST_POSTGRES_ADMIN_URL fehlt oder Service nicht erreichbar)."
            exit 1
          fi
          if ! grep -q "3 passed" /tmp/pg_audit_output.txt; then
            echo "FEHLER: Erwartet genau 3 bestandene PostgreSQL-Audit-Tests."
            exit 1
          fi

      - name: PostgreSQL-Memory-Tenant-Migrationstests (verpflichtend -- dürfen NICHT übersprungen werden)
        run: |
          set -o pipefail
          pytest tests/test_memory_tenant_migration_postgres.py -v --tb=short | tee /tmp/pg_tenant_migration_output.txt
          if grep -q "skipped" /tmp/pg_tenant_migration_output.txt; then
            echo "FEHLER: PostgreSQL-Memory-Tenant-Migrationstests wurden übersprungen -- in diesem Job nicht zulässig."
            exit 1
          fi
          if ! grep -q "5 passed" /tmp/pg_tenant_migration_output.txt; then
            echo "FEHLER: Erwartet genau 5 bestandene PostgreSQL-Memory-Tenant-Migrationstests."
            exit 1
          fi

  # Eigener Job statt zusaetzlicher Schritt im bestehenden "test"-Job: ein
  # Browser- oder Server-Startfehler im E2E-Lauf soll das Python-Testergebnis
  # nicht unuebersichtlich machen (getrennte, klar zuordenbare CI-Ergebnisse).
  frontend-e2e:
    runs-on: ubuntu-latest
    env:
      AILIZA_DATABASE_URL: "sqlite:///:memory:"
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      AILIZA_DEFAULT_TENANT_ID: default
      AILIZA_SECRET_KEY: ci-e2e-secret-key-not-for-production-32ch
      AILIZA_LOG_HMAC_KEY: ci-e2e-log-hmac-key-not-for-production-32ch

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-core.txt

      - name: Backend-Abhängigkeiten installieren
        run: pip install -r apps/backend/requirements-core.txt bcrypt pyotp

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren (reproduzierbar via Lockfile)
        working-directory: apps/frontend
        run: npm ci

      - name: Playwright Chromium installieren
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Backend starten (Login-Registrierung-UX-Test)
        run: |
          nohup python -m uvicorn apps.backend.main:app --host 127.0.0.1 --port 8811 --log-level warning \
            > /tmp/ailiza-e2e-login.log 2>&1 &
          echo $! > /tmp/ailiza-e2e-login.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8811/health && exit 0
            sleep 1
          done
          echo "Backend nicht innerhalb von 60s erreichbar:"; cat /tmp/ailiza-e2e-login.log; exit 1

      - name: Playwright – Login/Registrierung-UX
        working-directory: apps/frontend
        run: node tests/login-registration-ux.test.js http://127.0.0.1:8811

      - name: Backend stoppen (Login-Registrierung-UX-Test)
        if: always()
        run: kill "$(cat /tmp/ailiza-e2e-login.pid)" 2>/dev/null || true

      # Eigener Server-Prozess pro Test-Datei: /auth/login ist auf 10
      # Anfragen/Minute begrenzt (bewusst NICHT gelockert). Ein gemeinsamer
      # Prozess fuer beide Playwright-Dateien wuerde das In-Memory-Rate-
      # Limit-Budget ueberschreiten und die Tests faelschlich fehlschlagen
      # lassen -- ein frischer Prozess hat ein frisches Budget.
      - name: Backend starten (Bootstrap-Consent-Gate-Test)
        run: |
          nohup python -m uvicorn apps.backend.main:app --host 127.0.0.1 --port 8812 --log-level warning \
            > /tmp/ailiza-e2e-bootstrap.log 2>&1 &
          echo $! > /tmp/ailiza-e2e-bootstrap.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8812/health && exit 0
            sleep 1
          done
          echo "Backend nicht innerhalb von 60s erreichbar:"; cat /tmp/ailiza-e2e-bootstrap.log; exit 1

      - name: Playwright – Bootstrap-Consent-Gate (PR #62 Regression)
        working-directory: apps/frontend
        run: node tests/bootstrap-consent-gate.test.js http://127.0.0.1:8812

      - name: Backend stoppen (Bootstrap-Consent-Gate-Test)
        if: always()
        run: kill "$(cat /tmp/ailiza-e2e-bootstrap.pid)" 2>/dev/null || true
