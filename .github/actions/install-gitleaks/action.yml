name: gitleaks installieren
description: >
  Installiert gitleaks in fest gepinnter Version und prueft die
  SHA-256-Pruefsumme, bevor die Datei ausfuehrbar gemacht wird.

# Warum eine eigene Action: gitleaks wird in zwei Jobs gebraucht
# (secret-scan fuer den eigentlichen Scan, test fuer die Scanner-
# Selbsttests). Zwei Kopien desselben Installationsblocks wuerden
# frueher oder spaeter auseinanderlaufen -- insbesondere bei der
# Pruefsumme, also genau an der sicherheitsrelevanten Stelle.

runs:
  using: composite
  steps:
    - name: gitleaks herunterladen, pruefen und bereitstellen
      shell: bash
      env:
        # Version bewusst gepinnt: ein automatisches "latest" wuerde die
        # Regelmenge unangekuendigt aendern und den Job unvorhersehbar
        # machen. Die Pruefsumme gehoert zwingend zur Version -- beide
        # nur gemeinsam aendern.
        GITLEAKS_VERSION: "8.28.0"
        # Offizielle Pruefsumme aus gitleaks_8.28.0_checksums.txt des
        # GitHub-Release, verifiziert am 26.08.2026.
        GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
      run: |
        set -euo pipefail

        archive="${RUNNER_TEMP}/gitleaks.tar.gz"
        bindir="${RUNNER_TEMP}/bin"
        mkdir -p "$bindir"

        curl -sSfL -o "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

        # Pruefsumme VOR dem Entpacken und vor jedem Ausfuehrbarmachen.
        # Ohne diesen Schritt wuerde ein Sicherheitswerkzeug ungeprueft
        # aus dem Netz geladen und ausgefuehrt.
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -

        tar -xzf "$archive" -C "$bindir" gitleaks
        chmod 0755 "${bindir}/gitleaks"

        # Kein sudo, keine Installation nach /usr/local/bin: der Runner
        # braucht das Werkzeug nur fuer diesen Lauf.
        echo "$bindir" >> "$GITHUB_PATH"

    - name: Version bestaetigen
      shell: bash
      env:
        GITLEAKS_VERSION: "8.28.0"
      run: |
        set -euo pipefail
        actual="$(gitleaks version)"
        echo "gitleaks: ${actual}"
        if [ "$actual" != "$GITLEAKS_VERSION" ]; then
          echo "::error::Erwartet gitleaks ${GITLEAKS_VERSION}, gefunden ${actual}."
          exit 1
        fi
