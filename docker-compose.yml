# AILIZA — Autarker Betrieb (ohne Render/Neon)
# Start: docker compose up -d
# Daten liegen dauerhaft im benannten Volume ailiza_data (SQLite-Datei).
#
# Fuer lokalen Postgres-Container statt SQLite: siehe
# docs/AUTARKER_BETRIEB.md (Abschnitt "Optional: Postgres" -- bewusst
# nicht in dieser Datei vorkonfiguriert, um den Standardfall einfach zu
# halten).

services:
  ailiza:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODE: core
    ports:
      - "8000:8000"
    # Secrets kommen ausschliesslich aus der lokalen .env-Datei (nicht im
    # Repository). Vorlage: .env.example nach .env kopieren und ausfuellen.
    env_file:
      - .env
    environment:
      AILIZA_ENV: production
      AILIZA_DATABASE_URL: sqlite:////data/ailiza.sqlite
      AILIZA_EXTERNAL_LLM_ENABLED: "false"
      # Pflicht: mindestens 32 Zeichen. Ohne gueltigen Wert bricht der
      # Container beim Start kontrolliert ab (siehe Dockerfile-Entrypoint).
      # Der Wert wird NIE im Repository hinterlegt -- er kommt aus .env.
      AILIZA_SECRET_KEY: ${AILIZA_SECRET_KEY:?AILIZA_SECRET_KEY fehlt. Bitte .env anlegen (Vorlage: .env.example) und einen Wert mit mindestens 32 Zeichen setzen.}
    volumes:
      - ailiza_data:/data
    restart: unless-stopped

volumes:
  ailiza_data:
