# AILIZA Kill-Switch Initialzustand
# Wird vor jedem externen Provider-Aufruf neu und fail-closed ausgewertet.
# Laufzeitaenderungen an dieser Datei sind ein separater administrativer Vorgang.

global:
  enabled: true          # false = gesamtes System gestoppt

providers:
  groq:
    enabled: true
  anthropic:
    enabled: true
  openai:
    enabled: true
  openrouter:
    enabled: false

modules:
  memory:
    enabled: true
  audit:
    enabled: true
  consent:
    enabled: true

capabilities:
  data_export:
    enabled: true
  external_calls:
    enabled: true
